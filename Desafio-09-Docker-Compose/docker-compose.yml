services:
  db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-27018}:27017"
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USER}", "-p", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@db:27017/?authSource=admin
      MONGODB_DB: ${MONGO_DB}
    ports:
      - "${API_PORT:-3000}:3000"
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # perfil "tools": docker compose --profile tools up
  mongo-express:
    image: mongo-express:1.0.2-20
    profiles: [tools]
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@db:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD}
    ports:
      - "127.0.0.1:${ME_PORT:-8081}:8081"
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  # perfil "test": docker compose --profile test run --rm smoke
  smoke:
    image: node:22-alpine
    profiles: [test]
    working_dir: /app
    volumes:
      - ./test-routes.mjs:/app/test-routes.mjs:ro
    environment:
      TEST_URL: http://api:3000
    command: ["node", "test-routes.mjs"]
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy

networks:
  backend:

volumes:
  mongo_data:
