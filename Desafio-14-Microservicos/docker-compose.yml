services:
  user-service:
    build: ./user-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: user-service
      PORT: 3001
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  catalog-service:
    build: ./catalog-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: catalog-service
      PORT: 3002
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway-api:
    build: ./gateway-api
    restart: unless-stopped
    environment:
      SERVICE_NAME: gateway-api
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-2000}
      BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-3}
      BREAKER_RESET_MS: ${BREAKER_RESET_MS:-10000}
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    networks: [backend]
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  backend:
